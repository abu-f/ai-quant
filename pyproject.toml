[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aquant"
version = "0.1.0"
description = "A 股个人量化研究辅助工具（只读行情、回测、预警，无交易执行）"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
    "pandas>=2.0",
    "numpy>=1.24",
    "rich>=13.0",
    "PyYAML>=6.0",
    "Flask>=2.3",
]

[project.scripts]
aquant = "aquant.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aquant.web" = ["templates/*.html", "static/*.js"]
