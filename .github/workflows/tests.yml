name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支连续推送时，取消上一次未跑完的任务
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: 安装 ruff
        run: pip install ruff
      - name: 静态检查（未定义名/语法错误级别）
        run: ruff check --select E9,F63,F7,F82 src tests
      - name: 字节码编译检查
        run: python -m compileall -q src tests

  unit-tests:
    name: unit-tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 离线单元测试（不访问行情接口）
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: 构建 wheel 并校验元数据
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - name: 检查打包内是否包含模板与静态文件
        run: |
          python - <<'PY'
          import zipfile, glob
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          need = ["aquant/web/templates/index.html", "aquant/web/static/echarts.min.js"]
          missing = [n for n in need if not any(x.endswith(n) for x in names)]
          print("wheel:", wheel, "files:", len(names))
          if missing:
              raise SystemExit("缺少资源文件: " + ", ".join(missing))
          print("资源文件完整")
          PY
