name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 离线单元测试（不访问行情接口）
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
